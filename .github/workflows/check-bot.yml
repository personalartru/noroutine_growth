name: Check lead bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать лид-магнит
        run: python build_materials.py
      - name: Диагностика
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LEAD_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.LEAD_CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.LEAD_ADMIN_CHAT_ID }}
        run: python bot.py --check
      - name: Сквозная проверка (выдать архив в личку админа)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LEAD_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.LEAD_CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.LEAD_ADMIN_CHAT_ID }}
        run: python bot.py --test
