name: Check materials

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать лид-магнит
        run: python build_materials.py
      - name: Сверить содержимое с репозиторием
        run: |
          if ! git diff --quiet -- materials/workflows materials/workflows-bonus materials/README.md; then
            echo "::error::Воркфлоу в репозитории разошлись с build_materials.py — пересоберите и закоммитьте."
            git diff --stat -- materials/workflows materials/workflows-bonus materials/README.md
            exit 1
          fi
          python scripts/verify_materials.py
