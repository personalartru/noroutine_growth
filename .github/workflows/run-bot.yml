name: Run lead bot (GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут работать (максимум 20, чтобы не упереться в лимит)"
        required: false
        default: "9"
        type: string
  push:
    branches: [main]
    paths:
      - "bot.py"
      - "max_lead.py"
      - "optimizer.py"
      - "footer.py"
      - "requirements.txt"
      - ".github/workflows/run-bot.yml"

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Имя группы меняем при смене схемы очереди: отменённый прогон в очереди
      # иногда оставляет группу зависшей, и новые прогоны не стартуют.
      # cancel-in-progress: false — идущий цикл никогда не прерывается, но
      # группа хранит ровно одного стоящего в очереди: новый прогон вытесняет
      # предыдущего queued. Поэтому шаг «Поставить в очередь следующий цикл»
      # не добавляет свой прогон, когда очередь уже занята — иначе он отменял
      # queued-прогон push, и свежий код уезжал в прод на круг позже.
      group: lead-bot-v2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать лид-магнит
        run: python build_materials.py
      - name: Сертификаты Минцифры (нужны для API MAX)
        # gu-st.ru периодически обрывает соединение (curl 56). Раньше одна такая
        # осечка роняла цикл ещё до шага опроса: свежий код не доходил до прода
        # до следующего круга. Ретраи + неловящий шаг, чтобы цепочка не вставала.
        continue-on-error: true
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          fetch() { curl --fail --silent --show-error --location \
                      --retry 4 --retry-delay 3 --retry-all-errors --max-time 25 \
                      "$1" -o "$2"; }
          { fetch https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt /tmp/root.crt &&
            fetch https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt /tmp/sub.crt &&
            sudo cp /tmp/root.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt &&
            sudo cp /tmp/sub.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt &&
            sudo update-ca-certificates; } ||
            echo "::warning::Сертификаты Минцифры не забрал — цикл идёт на системном бандле"
      - name: Восстановить offset
        uses: actions/cache/restore@v4
        with:
          path: |
            .offset
            .max_offset
            .max_pending.json
            .max_comment_chat
            .max_dialogs.json
            .max_optimizer.json
          key: lead-bot-offset-${{ github.run_id }}
          restore-keys: lead-bot-offset-
      - name: Опрашивать Telegram и MAX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LEAD_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.LEAD_CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.LEAD_ADMIN_CHAT_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID || '-71062363105923' }}
          MAX_ADMIN_CHAT_ID: ${{ secrets.MAX_ADMIN_CHAT_ID || '' }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          POLL_TIMEOUT: "20"
          BOT_RUN_MINUTES: ${{ inputs.minutes || '9' }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          python bot.py --run-minutes "${{ inputs.minutes || '9' }}" &
          if [ -n "$MAX_BOT_TOKEN" ]; then
            python max_lead.py --minutes "${{ inputs.minutes || '9' }}" &
          else
            echo "MAX_BOT_TOKEN не задан — MAX-часть пропущена"
          fi
          wait
      - name: Сохранить offset
        uses: actions/cache/save@v4
        with:
          path: |
            .offset
            .max_offset
            .max_pending.json
            .max_comment_chat
            .max_dialogs.json
            .max_optimizer.json
          key: lead-bot-offset-${{ github.run_id }}
      - name: Поставить в очередь следующий цикл
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          WF: "Run lead bot (GitHub Actions)"
          REPO: personalartru/noroutine_growth
        run: |
          set -u
          queued() {
            gh run list --repo "$REPO" --workflow "$WF" --limit 10 --json status \
              --jq '[.[] | select(.status == "queued" or .status == "pending"
                                 or .status == "waiting" or .status == "requested")]
                    | length' 2>/dev/null || echo 0
          }
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN не задан — следующий цикл не запущен"
            exit 0
          fi
          # minutes не передаём: новый прогон берёт дефолт из workflow,
          # иначе старое значение тащится по всей цепочке.
          #
          # Очередь группы lead-bot-v2 держит одного стоящего: если поставить
          # свой прогон поверх queued-прогона push, GitHub отменит того, а его
          # прогон и так опросил бы свежий main. Поэтому сначала смотрим,
          # не занят ли слот (свой in_progress-прогон в фильтр не попадает).
          busy=$(queued)
          if [ "${busy:-0}" -gt 0 ]; then
            echo "В очереди уже стоит прогонов: $busy — свой не ставим, чтобы их не отменили"
            exit 0
          fi
          # Dispatch может провалиться молча (не стало слота, сбой API) — тогда
          # цепочка умирает и бот молчит до ручного запуска. Проверяем результат
          # и досылаем, максимум три попытки.
          for attempt in 1 2 3; do
            if ! gh workflow run "$WF" --repo "$REPO" --ref "${{ github.ref_name }}"; then
              echo "::warning::попытка $attempt: gh workflow run вернул ошибку"
            fi
            sleep 15
            busy=$(queued)
            if [ "${busy:-0}" -gt 0 ]; then
              echo "Следующий цикл в очереди (попытка $attempt, стоящих: $busy)"
              exit 0
            fi
            echo "::warning::попытка $attempt: в очереди пусто, повторяем"
          done
          echo "::error::не удалось поставить следующий цикл за 3 попытки: " \
               "цепочка встанет до watchdog run-queue.yml. Вручную — gh workflow run «WF» --ref main"
          # Падаем специально: мертвую цепочку видно в списке прогонов,
          # а не только в чужом логе, который никто не открывает.
          exit 1
