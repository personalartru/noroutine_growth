name: Run lead bot (GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут работать (максимум 20, чтобы не упереться в лимит)"
        required: false
        default: "9"
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lead-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать лид-магнит
        run: python build_materials.py
      - name: Сертификаты Минцифры (нужны для API MAX)
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/root.crt
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o /tmp/sub.crt
          sudo cp /tmp/root.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo cp /tmp/sub.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo update-ca-certificates
      - name: Восстановить offset
        uses: actions/cache/restore@v4
        with:
          path: |
            .offset
            .max_offset
            .max_pending.json
          key: lead-bot-offset-${{ github.run_id }}
          restore-keys: lead-bot-offset-
      - name: Опрашивать Telegram и MAX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LEAD_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.LEAD_CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.LEAD_ADMIN_CHAT_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID || '-71062363105923' }}
          MAX_ADMIN_CHAT_ID: ${{ secrets.MAX_ADMIN_CHAT_ID || '' }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          POLL_TIMEOUT: "20"
          BOT_RUN_MINUTES: ${{ inputs.minutes || '9' }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          python bot.py --run-minutes "${{ inputs.minutes || '9' }}" &
          if [ -n "$MAX_BOT_TOKEN" ]; then
            python max_lead.py --minutes "${{ inputs.minutes || '9' }}" &
          else
            echo "MAX_BOT_TOKEN не задан — MAX-часть пропущена"
          fi
          wait
      - name: Сохранить offset
        uses: actions/cache/save@v4
        with:
          path: |
            .offset
            .max_offset
            .max_pending.json
          key: lead-bot-offset-${{ github.run_id }}
      - name: Поставить в очередь следующий цикл
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN не задан — следующий цикл не запущен"
            exit 0
          fi
          # minutes не передаём: новый прогон берёт дефолт из workflow,
          # иначе старое значение тащится по всей цепочке.
          gh workflow run "Run lead bot (GitHub Actions)" \
            --ref "${{ github.ref_name }}" || echo "не удалось поставить в очередь"
