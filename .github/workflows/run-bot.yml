name: Run lead bot (GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут работать (максимум 9, чтобы не упереться в лимит)"
        required: false
        default: "8"
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "*/11 * * * *"

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Собрать лид-магнит
        run: python build_materials.py
      - name: Восстановить offset
        uses: actions/cache/restore@v4
        with:
          path: .offset
          key: lead-bot-offset-${{ github.run_id }}
          restore-keys: lead-bot-offset-
      - name: Опрашивать Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.LEAD_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.LEAD_CHANNEL_USERNAME }}
          ADMIN_CHAT_ID: ${{ secrets.LEAD_ADMIN_CHAT_ID }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          POLL_TIMEOUT: "20"
          BOT_RUN_MINUTES: ${{ inputs.minutes || '8' }}
        run: python bot.py --run-minutes "${{ inputs.minutes || '8' }}"
      - name: Сохранить offset
        uses: actions/cache/save@v4
        with:
          path: .offset
          key: lead-bot-offset-${{ github.run_id }}
      - name: Поставить в очередь следующий цикл
        if: always() && env.DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh workflow run "Run lead bot (GitHub Actions)" \
            --ref "${{ github.ref_name }}" \
            -f minutes "${{ inputs.minutes || '8' }}" || echo "не удалось поставить в очередь"
