name: Lead-bot watchdog

# Страховка для цепочки самопереочередей в run-bot.yml: cron раз в 15 минут
# проверяет, стоит ли хоть один прогон оптимизатора в работе или в очереди, и
# если нет — ставит новый. Сам он в группу lead-bot-v2 не входит и слот не
# занимает, поэтому не вытесняет queued-прогон push.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Проверить очередь и поставить цикл, если пусто
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          WF: "Run lead bot (GitHub Actions)"
          # Без checkout каталог не git-репозиторий, и gh не выводит репозиторий
          # из контекста: «failed to determine base repo». Путь задаём явно.
          REPO: personalartru/noroutine_growth
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN не задан — watchdog ничего не может поставить"
            exit 1
          fi
          # Свой workflow (watchdog) в счёт не идёт: считаем только прогоны бота.
          busy=$(gh run list --repo "$REPO" --workflow "$WF" --limit 20 \
                   --json status \
                   --jq '[.[] | select(.status == "queued" or .status == "pending"
                                      or .status == "waiting" or .status == "requested"
                                      or .status == "in_progress")] | length')
          echo "Прогонов бота в работе/очереди: $busy"
          if [ "$busy" -gt 0 ]; then
            echo "Цепочка жива — новый прогон не нужен"
            exit 0
          fi
          gh workflow run "$WF" --repo "$REPO" --ref main
          sleep 5
          after=$(gh run list --repo "$REPO" --workflow "$WF" --limit 5 --json status \
                    --jq '[.[] | select(.status == "queued" or .status == "pending"
                                       or .status == "waiting" or .status == "requested"
                                       or .status == "in_progress")] | length')
          echo "Прогонов после dispatch: $after"
          [ "$after" -gt 0 ] && echo "Цепочка восстановлена" \
            || { echo "::error::dispatch прошёл, но очереди нет"; exit 1; }
