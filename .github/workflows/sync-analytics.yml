name: Sync analytics (Telegram + MAX)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-analytics.yml'
      - 'fetch_analytics.py'
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout noroutine_growth
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch analytics
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TG_CHANNEL_USERNAME: noroutine2026
          MAX_CHANNEL_ID: -71062363105923
        run: python3 fetch_analytics.py --out analytics.json

      - name: Commit analytics.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add analytics.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Analytics update: $(date -u '+%Y-%m-%d %H:%M')"
            git push
            echo "analytics.json updated"
          fi
