# ШАБЛОН. Не применяйте его как есть — секреты кладут через
# kubectl create secret (см. sync-secrets.sh) или вручную:
#
#   kubectl -n lead-bot create secret generic lead-bot-env \
#     --from-literal=TELEGRAM_BOT_TOKEN=... \
#     --from-literal=LEAD_CHANNEL_USERNAME=@noroutine2026 \
#     --from-literal=LEAD_ADMIN_CHAT_ID=270479866 \
#     --from-literal=MAX_BOT_TOKEN=... \
#     --from-literal=MAX_ADMIN_CHAT_ID=60669315 \
#     --from-literal=MAX_PING_CHAT_ID=485434975
apiVersion: v1
kind: Secret
metadata:
  name: lead-bot-env
  namespace: lead-bot
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  LEAD_CHANNEL_USERNAME: "@noroutine2026"
  LEAD_ADMIN_CHAT_ID: "270479866"
  MAX_BOT_TOKEN: "REPLACE_ME"
  MAX_ADMIN_CHAT_ID: "60669315"
